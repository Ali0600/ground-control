name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: jobs only read the repo.
permissions:
  contents: read

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the LOWEST we run — run.sh builds the dev venv from macOS's system
        # python3. It was linted for (ruff target-version = py39) but never executed,
        # so 3.10+ syntax that ruff's selected rules don't reject could merge green and
        # break the dev machine. 3.12 is what the deployed agent runs.
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # tests/test_page.py EXECUTES the demo-mode scrub block under node rather than
      # grepping it, and parse-checks the whole page script. Those tests assert node is
      # present instead of skipping — a skip would silently disarm a privacy gate — so
      # install it rather than relying on the runner image happening to ship it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      # The suite is fixture-only (pure parsers, no live launchctl/lsof), so it
      # runs fine on Linux even though the tool itself targets macOS.
      - run: ruff check .
      # A ratchet, set just under the measured floor: raise it as coverage climbs,
      # never lower it to make a PR pass.
      # Named separately from the suite below so a privacy failure is legible in the
      # checks list rather than buried in a pytest summary. (It also runs inside the
      # suite; this step is about where the failure SHOWS.)
      - name: No personal data in a public repo
        run: pytest -q tests/test_privacy.py
      - run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=86

  # The name below is the branch ruleset's REQUIRED CHECK, so it must stay stable no
  # matter how the matrix above changes. Adding the 3.9/3.12 matrix renamed the only
  # job to "Lint + test (py3.9)" / "(py3.12)", so the required "Lint + test" became a
  # check that could never report again — every PR unmergeable, with nothing red to
  # explain why. An aggregate gate decouples the required name from the matrix shape.
  gate:
    name: Lint + test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `always()` matters: without it a failed matrix leaves this job SKIPPED, and a
    # skipped required check does not block a merge. Fail closed, and say why.
    if: always()
    steps:
      - name: Every matrix job must have succeeded
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "matrix result: $RESULT"
          test "$RESULT" = "success"
