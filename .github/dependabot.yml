# SECURITY updates only. `open-pull-requests-limit: 0` is GitHub's documented way to
# switch off routine VERSION updates while leaving security updates untouched — those
# come from the repo's alerts and dependency graph, not from this file. So a Dependabot
# PR here means "there is a CVE", and nothing else.
#
# Two traps, both pinned by tests/test_workflows.py: raising the limit turns routine
# bumps back on, and adding `target-branch` to an entry SILENTLY disables security
# updates for that ecosystem. The `groups` blocks are kept so that if the limit is ever
# raised deliberately, the noise is still batched.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      pip-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    # The local dev venv is system Python 3.9 (run.sh); these ranges require
    # >=3.10, so a floor bump into them makes the requirements uninstallable
    # locally even though CI (3.12) stays green. NOTE: ignore also suppresses
    # security PRs for these ranges — acceptable for a localhost-only tool.
    ignore:
      - dependency-name: fastapi
        versions: ['>=0.129.0']
      - dependency-name: uvicorn
        versions: ['>=0.40.0']
      - dependency-name: pytest
        versions: ['>=9.0.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions:
        patterns: ['*']
